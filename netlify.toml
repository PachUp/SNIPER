# https://sniper-proj.netlify.app/
# Git push to main should trigger a rebuild. Requires @netlify/plugin-nextjs
# so App Router / API routes (admin login cookies) actually run.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
